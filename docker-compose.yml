services:
  postgres:
    image: postgres:16-alpine
    container_name: notes-postgres
    restart: unless-stopped
    # Database kept internal to Docker network, no host port collision
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: notes-redis
    restart: unless-stopped
    # Redis kept internal to Docker network, no host port collision
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  notes-api:
    build:
      context: ./notes-api
      dockerfile: Dockerfile
    container_name: notes-api
    restart: unless-stopped
    ports:
      - "${NOTES_API_PORT:-9933}:8080"
    env_file:
      - .env
    volumes:
      # Mount root .env into container
      - ./.env:/app/.env:ro
    environment:
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: notes_api
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: 0
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-notes-api-native-32b!}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      JWT_REFRESH_EXPIRATION_HOURS: ${JWT_REFRESH_EXPIRATION_HOURS:-168}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  notes-api-gin:
    build:
      context: ./notes-api-gin
      dockerfile: Dockerfile
    container_name: notes-api-gin
    restart: unless-stopped
    ports:
      - "${NOTES_API_GIN_PORT:-9944}:8081"
    env_file:
      - .env
    volumes:
      # Mount root .env into container
      - ./.env:/app/.env:ro
    environment:
      PORT: "8081"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: notes_api_gin
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: 1
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-notes-api-gin-32b!}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      JWT_REFRESH_EXPIRATION_HOURS: ${JWT_REFRESH_EXPIRATION_HOURS:-168}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
